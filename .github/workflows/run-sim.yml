name: Run Campaign Simulation (manual)

on:
  workflow_dispatch:
    inputs:
      demand_file:
        required: true
        default: campaign_demand_base.csv
      scenario:
        required: false
        default: base

jobs:
  run-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run simulation via script
        run: |
          python3 tools/run_simulation.py --demand "${{ github.event.inputs.demand_file }}" --scenario "${{ github.event.inputs.scenario }}" --out "runs/run_${{ github.run_id }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-${{ github.run_id }}
          path: runs/run_${{ github.run_id }}