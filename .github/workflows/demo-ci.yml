name: PoC Demo CI (masil-poc, Linux) - enhanced

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (base|conservative|optimistic)'
        required: false
        default: 'base'
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.10"

jobs:
  run-poc:
    runs-on: ubuntu-latest
    env:
      RUNS_DIR: ${{ github.workspace }}/masil-poc/results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies for pycairo
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev \
            ninja-build

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --only-binary=pycairo pycairo || true
          pip install -r requirements-lock.txt
          if [ -f "masil-poc/pyproject.toml" ] || [ -f "masil-poc/setup.py" ]; then
            pip install --no-deps -e ./masil-poc
          fi

      - name: Prepare results dir
        run: |
          mkdir -p "${{ github.workspace }}/masil-poc/results"

      - name: Validate input files (generate validation_report.json)
        id: validate_inputs
        run: |
          python3 masil-poc/backend/validate_files.py --dir masil-poc/original --out masil-poc/results || true
          echo "validation_step=done" >> $GITHUB_OUTPUT

      - name: Generate initial run metadata (start)
        id: meta_start
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'base' }}"
          python3 masil-poc/backend/run_metadata.py --scenario "$SCENARIO" --assumptions masil-poc/inputs/assumptions.csv --out masil-poc/results
          RUN_ID=$(python3 -c "import json,os; print(json.load(open(os.path.join('masil-poc','results','run_metadata.json'))).get('run_id'))")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "None" ]; then
            echo "Error: run_id not generated" >&2
            exit 1
          fi
          echo "DEBUG_RUN_ID=${RUN_ID}" >&2
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Run simulator and generators (into run-specific folder)
        id: run_sim
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'base' }}"
          RUN_ID="${{ steps.meta_start.outputs.run_id }}"
          RUN_OUT="${{ github.workspace }}/masil-poc/results/${RUN_ID}"
          rm -rf "${RUN_OUT}"
          mkdir -p "${RUN_OUT}"
          python3 masil-poc/backend/cash_simulator.py --scenario "$SCENARIO" --out "${RUN_OUT}" --data masil-poc/original
          python3 masil-poc/backend/generate_approvals.py --data masil-poc/original --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          python3 masil-poc/backend/generate_report.py --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          cp masil-poc/results/run_metadata.json "${RUN_OUT}/" 2>/dev/null || true
          echo "run_out=${RUN_OUT}" >> $GITHUB_OUTPUT

      - name: Mark run finished (update finished_at)
        id: meta_finish
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 masil-poc/backend/run_metadata.py --update-finish --out "${RUN_OUT}"

      - name: Generate manifest
        id: manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 masil-poc/tools/generate_manifest.py "${RUN_OUT}"

      - name: Verify manifest
        id: verify_manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 masil-poc/tools/verify_manifest.py "${RUN_OUT}"

      - name: Run validation/asserts (robust)
        id: asserts
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          VR="${RUN_OUT}/validation_report.json"
          if [ ! -f "$VR" ]; then VR="masil-poc/results/validation_report.json"; fi
          python3 masil-poc/tools/asserts_validate.py "$VR"
          PROJ="${RUN_OUT}/full_cash_projection.csv"
          if [ ! -f "$PROJ" ]; then echo "ERROR: projection missing" >&2; exit 1; fi
          LINE=$(grep -n '^2026-07-21' "$PROJ" | head -n1 | sed 's/\r$//')
          if [ -z "$LINE" ]; then echo "ERROR: 2026-07-21 missing" >&2; exit 1; fi
          LINE_CONTENT=$(echo "$LINE" | sed 's/^[0-9]*://')
          COL7=$(echo "$LINE_CONTENT" | awk -F'|' '{print $7}' | tr -d '\r' | sed 's/^[ \t]*//;s/[ \t]*$//' | tr '[:upper:]' '[:lower:]')
          echo "DEBUG: 2026-07-21 col7='$COL7'"
          if [ "$COL7" != "true" ]; then echo "ERROR: covenant_breach not true" >&2; exit 1; fi
          echo "Domain asserts passed."

      - name: Run unit and integration tests (pytest)
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/masil-poc:${{ github.workspace }}/masil-poc/tools:${{ github.workspace }}
        run: |
          python -m pytest -q || ( echo "pytest failed"; exit 1 )


      - name: Run mock supplier demo (simulate external replies)
        if: ${{ always() }}
        id: mock_supplier_demo
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          # default: use mock supplier to simulate responses for PO items
          python3 masil-poc/tools/mock_supplier.py --run-out "$RUN_OUT" --po-id SPO-0001 --amount 524160000 --scenario random || true
          python3 masil-poc/tools/mock_supplier.py --run-out "$RUN_OUT" --po-id SPO-0003 --amount 436800000 --scenario partial || true
          # after mock responses, optionally trigger action_handler to process events
          python3 masil-poc/backend/action_handler.py --process-events --run-out "$RUN_OUT" || true

      - name: Re-run projection if events changed
        if: ${{ always() }}
        id: rerun_after_events
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          # if action_handler created po_status.json or similar, re-run simulator
          if [ -f "${RUN_OUT}/po_status.json" ]; then
            python3 masil-poc/backend/cash_simulator.py --out "${RUN_OUT}" --data masil-poc/original
            python3 masil-poc/tools/generate_manifest.py "${RUN_OUT}"
            python3 masil-poc/tools/verify_manifest.py "${RUN_OUT}"
          fi

      - name: Package and upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ steps.meta_start.outputs.run_id }}
          path: masil-poc/results/${{ steps.meta_start.outputs.run_id }}
          retention-days: 30
