name: PoC Demo CI (Linux, Enhanced)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (base|conservative|optimistic)'
        required: false
        default: 'base'

jobs:
  run-poc:
    runs-on: ubuntu-latest
    env:
      RUN_BASE_DIR: results
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib reportlab jq

      - name: Prepare results dir
        run: |
          mkdir -p results

      - name: Validate input files (generate validation_report.json)
        id: validate
        run: |
          python3 backend/validate_files.py --dir original --out results || { echo "Validation failed"; exit 4; }
          echo "Validation passed or report generated."

      - name: Generate initial run metadata (start)
        id: meta_start
        run: |
          SCENARIO="${{ github.event.inputs.scenario }}"
          python3 backend/run_metadata.py --scenario "$SCENARIO" --assumptions inputs/assumptions.csv --out results
          RUN_ID=$(python3 -c "import json,sys;print(json.load(open('results/run_metadata.json'))['run_id'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Run simulator and generators (into run-specific folder)
        id: run_sim
        run: |
          RUN_ID="${{ steps.meta_start.outputs.run_id }}"
          RUN_OUT="results/${RUN_ID}"
          rm -rf "${RUN_OUT}"
          mkdir -p "${RUN_OUT}"
          python3 backend/cash_simulator.py --scenario "${{ github.event.inputs.scenario }}" --out "${RUN_OUT}" --data original
          python3 backend/generate_approvals.py --data original --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          python3 backend/generate_report.py --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          cp results/validation_report.json "${RUN_OUT}/" 2>/dev/null || true
          cp results/run_metadata.json "${RUN_OUT}/"
          echo "run_out=${RUN_OUT}" >> $GITHUB_OUTPUT

      - name: Mark run finished (update finished_at)
        id: meta_finish
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 backend/run_metadata.py --update-finish --out "${RUN_OUT}"
          echo "finished run metadata updated for ${RUN_OUT}"

      - name: Generate manifest (sha256) for run folder
        id: manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 tools/generate_manifest.py "${RUN_OUT}"
          echo "manifest generated at ${RUN_OUT}/manifest.json"

      - name: Verify manifest integrity (compare hashes)
        id: verify_manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          python3 - <<'PY'
import json,hashlib,os,sys
run_out = os.environ['RUN_OUT']
mfile = os.path.join(run_out, 'manifest.json')
if not os.path.exists(mfile):
  print("manifest.json not found", mfile); sys.exit(2)
m = json.load(open(mfile, encoding='utf-8'))
bad=[]
for rel, expected in m['manifest'].items():
  p = os.path.join(run_out, rel)
  if not os.path.exists(p):
    bad.append((rel, 'MISSING'))
    continue
  h = hashlib.sha256(open(p,'rb').read()).hexdigest()
  if h != expected:
    bad.append((rel, expected, h))
if bad:
  print("MISMATCHES FOUND:", bad)
  sys.exit(3)
print("Manifest OK: all files match.")
PY

      - name: Validation asserts (auto-fail if unexpected)
        id: asserts
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          # validation_report: must have all status == ok
          python3 - <<'PY'
import json,sys
r=json.load(open("results/validation_report.json"))
for entry in r.get("report",[]):
    if entry.get("status") != "ok":
        print("validation error:", entry)
        sys.exit(1)
print("validation ok")
PY
          # check that 2026-07-21 row exists and covenant_breach is True
          if ! grep -q '^2026-07-21' "${RUN_OUT}/full_cash_projection.csv"; then
            echo "ERROR: 2026-07-21 row not found"; exit 6
          fi
          awk -F'|' '$1=="2026-07-21" { if ($7 != "True") exit 1 } END { if (NR==0) exit 1 }' "${RUN_OUT}/full_cash_projection.csv" || { echo "ERROR: covenant_breach not True on 2026-07-21"; exit 7; }
          echo "Asserts passed."

      - name: Package run artifacts (zip)
        id: package
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          RUN_ID=$(basename "${RUN_OUT}")
          ZIPNAME="submission_${RUN_ID}.zip"
          rm -f "${ZIPNAME}"
          (cd "${RUN_OUT}" && zip -r "../${ZIPNAME}" .)
          echo "zipname=${ZIPNAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact (run-level package)
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ github.run_number }}
          path: submission_*.zip
          retention-days: 30