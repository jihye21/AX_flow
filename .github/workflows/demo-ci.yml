name: PoC Demo CI (masil-poc, Linux)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (base|conservative|optimistic)'
        required: false
        default: 'base'

jobs:
  run-poc:
    runs-on: ubuntu-latest
    env:
      BASE_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib reportlab jq

      - name: Prepare masil-poc/results dir
        run: |
          mkdir -p "${{ github.workspace }}/masil-poc/results"

      - name: Validate input files (generate validation_report.json)
        id: validate_inputs
        run: |
          python3 "${{ github.workspace }}/masil-poc/backend/validate_files.py" \
            --dir "${{ github.workspace }}/masil-poc/original" \
            --out "${{ github.workspace }}/masil-poc/results" || true
          echo "Validation step completed (report generated if issues)."

      - name: Generate initial run metadata (start)
        id: meta_start
        run: |
          SCENARIO="${{ github.event.inputs.scenario }}"
          python3 "${{ github.workspace }}/masil-poc/backend/run_metadata.py" \
            --scenario "$SCENARIO" \
            --assumptions "${{ github.workspace }}/masil-poc/inputs/assumptions.csv" \
            --out "${{ github.workspace }}/masil-poc/results"
          RUN_ID=$(python3 -c "import json,os; print(json.load(open(os.path.join('masil-poc','results','run_metadata.json'))).get('run_id'))")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "None" ]; then
            echo "Error: run_id not generated"; exit 1
          fi
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Run simulator and generators (into run-specific folder)
        id: run_sim
        run: |
          SCENARIO="${{ github.event.inputs.scenario }}"
          RUN_ID="${{ steps.meta_start.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: RUN_ID is empty (meta_start did not produce run_id)"; exit 1
          fi
          RUN_OUT="${{ github.workspace }}/masil-poc/results/${RUN_ID}"
          rm -rf "${RUN_OUT}"
          mkdir -p "${RUN_OUT}"
          echo "Running scenario: $SCENARIO, RUN_OUT: $RUN_OUT"
          python3 "${{ github.workspace }}/masil-poc/backend/cash_simulator.py" \
            --scenario "$SCENARIO" --out "${RUN_OUT}" --data "${{ github.workspace }}/masil-poc/original"
          python3 "${{ github.workspace }}/masil-poc/backend/generate_approvals.py" \
            --data "${{ github.workspace }}/masil-poc/original" \
            --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          python3 "${{ github.workspace }}/masil-poc/backend/generate_report.py" \
            --proj "${RUN_OUT}/full_cash_projection.csv" --out "${RUN_OUT}"
          # copy top-level validation_report/run_metadata for audit trace if present
          cp "${{ github.workspace }}/masil-poc/results/validation_report.json" "${RUN_OUT}/" 2>/dev/null || true
          cp "${{ github.workspace }}/masil-poc/results/run_metadata.json" "${RUN_OUT}/" 2>/dev/null || true
          echo "run_out=${RUN_OUT}" >> $GITHUB_OUTPUT

      - name: Mark run finished (update finished_at)
        id: meta_finish
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          if [ -z "$RUN_OUT" ]; then
            echo "ERROR: RUN_OUT is empty"; exit 1
          fi
          python3 "${{ github.workspace }}/masil-poc/backend/run_metadata.py" --update-finish --out "${RUN_OUT}"
          echo "Updated finished_at in ${RUN_OUT}/run_metadata.json"

      - name: Generate manifest (sha256) for run folder
        id: manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          if [ -z "$RUN_OUT" ]; then
            echo "ERROR: RUN_OUT is empty"; exit 1
          fi
          python3 "${{ github.workspace }}/masil-poc/tools/generate_manifest.py" "${RUN_OUT}"
          echo "Generated manifest at ${RUN_OUT}/manifest.json"

      - name: Verify manifest integrity (compare hashes)
        id: verify_manifest
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          if [ -z "$RUN_OUT" ]; then
            echo "ERROR: RUN_OUT is empty"; exit 1
          fi
          python3 "${{ github.workspace }}/masil-poc/tools/verify_manifest.py" "${RUN_OUT}"
          echo "Manifest verification completed."

      - name: Validation & domain asserts (auto-fail if unexpected)
        id: asserts
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          if [ -z "$RUN_OUT" ]; then
            echo "ERROR: RUN_OUT is empty"; exit 1
          fi
          # determine validation_report path (prefer run-specific)
          VR="${RUN_OUT}/validation_report.json"
          if [ ! -f "$VR" ]; then
            VR="${{ github.workspace }}/masil-poc/results/validation_report.json"
          fi
          if [ ! -f "$VR" ]; then
            echo "ERROR: validation_report.json not found at expected locations: ${VR}" >&2
            exit 1
          fi
          # call external python validator (asserts_validate.py)
          python3 "${{ github.workspace }}/masil-poc/tools/asserts_validate.py" "$VR"
          VAL_EXIT=$?
          if [ $VAL_EXIT -ne 0 ]; then
            echo "ERROR: validation failed (exit code $VAL_EXIT). See ${VR}" >&2
            exit $VAL_EXIT
          fi
          # check that 2026-07-21 row exists and covenant_breach is True
          PROJ="${RUN_OUT}/full_cash_projection.csv"
          if [ ! -f "$PROJ" ]; then
            echo "ERROR: projection file not found: ${PROJ}" >&2
            exit 1
          fi
          if ! grep -q '^2026-07-21' "$PROJ"; then
            echo "ERROR: 2026-07-21 row not found in projection ${PROJ}" >&2
            exit 1
          fi
          awk -F'|' '$1=="2026-07-21" { if ($7 != "True") exit 1 } END { if (NR==0) exit 1 }' "$PROJ"
          if [ $? -ne 0 ]; then
            echo "ERROR: covenant_breach not True on 2026-07-21 in ${PROJ}" >&2
            exit 1
          fi
          echo "Domain asserts passed."

      - name: Package run artifacts (zip)
        id: package
        run: |
          RUN_OUT="${{ steps.run_sim.outputs.run_out }}"
          if [ -z "$RUN_OUT" ]; then
            echo "ERROR: RUN_OUT is empty" >&2
            exit 1
          fi
          RUN_ID=$(basename "${RUN_OUT}")
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: RUN_ID could not be determined" >&2
            exit 1
          fi
          ZIPNAME="submission_${RUN_ID}.zip"
          OUT_DIR="$(dirname "${RUN_OUT}")"
          rm -f "${OUT_DIR}/${ZIPNAME}"
          (cd "${RUN_OUT}" && zip -r "${OUT_DIR}/${ZIPNAME}" .)
          if [ $? -ne 0 ]; then
            echo "ERROR: failed to create zip ${OUT_DIR}/${ZIPNAME}" >&2
            exit 1
          fi
          echo "Created ${OUT_DIR}/${ZIPNAME}"
          echo "zipname=${ZIPNAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact (run-level package)
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ github.run_number }}
          path: masil-poc/results/submission_*.zip
          retention-days: 30